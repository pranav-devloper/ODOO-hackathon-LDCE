{% extends 'admin_base.html' %}

{% block title %}Users - Admin Control Center{% endblock %}
{% block header_title %}User Management{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto">
  <div class="flex items-center justify-between mb-8">
    <div class="flex items-center space-x-3">
      <h1 class="font-display text-2xl font-bold text-on-surface">Platform Users</h1>
    </div>
    <div class="flex gap-4">
      <div class="relative">
        <span class="material-symbols-outlined absolute left-3 top-2.5 text-on-surface-variant text-[20px]">search</span>
        <input type="text" id="searchInput" placeholder="Search users..." class="pl-10 pr-4 py-2 bg-surface-container-high border border-outline-variant rounded-lg text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary w-64 text-on-surface">
      </div>
      <button class="flex items-center gap-2 bg-surface-container-high border border-outline-variant px-4 py-2 rounded-lg text-sm font-medium hover:bg-surface-variant transition-colors text-on-surface">
        <span class="material-symbols-outlined text-[18px]">filter_list</span>
        Filter
      </button>
    </div>
  </div>

  <div class="bg-surface-container-high border border-outline-variant rounded-xl overflow-hidden flex flex-col shadow-sm">
    <div class="overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="text-xs text-on-surface-variant uppercase bg-surface-container-low border-b border-outline-variant">
          <tr>
            <th class="px-6 py-4">User</th>
            <th class="px-6 py-4">Role</th>
            <th class="px-6 py-4 text-center">Trips</th>
            <th class="px-6 py-4">Status</th>
            <th class="px-6 py-4 text-right">Joined</th>
            <th class="px-6 py-4 text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody" class="divide-y divide-outline-variant text-on-surface">
          <tr>
            <td colspan="6" class="px-6 py-8 text-center text-on-surface-variant">Loading users...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allUsers = [];

async function fetchUsers() {
    try {
        const res = await fetch('/api/admin/users');
        const json = await res.json();
        if (json.success) {
            allUsers = json.data;
            renderUsers(allUsers);
        } else {
            showAdminToast('Error', 'Failed to load users', 'error');
        }
    } catch (e) {
        showAdminToast('Error', 'Failed to fetch users', 'error');
    }
}

function renderUsers(users) {
    const tbody = document.getElementById('usersTableBody');
    if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-on-surface-variant">No users found.</td></tr>';
        return;
    }
    
    tbody.innerHTML = users.map(u => `
        <tr class="hover:bg-surface-variant/50 transition-colors">
            <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-primary-container text-primary flex items-center justify-center font-bold text-sm shrink-0">${u.name.charAt(0).toUpperCase()}</div>
                    <div>
                        <div class="font-medium text-on-surface">${u.name}</div>
                        <div class="text-xs text-on-surface-variant">${u.email}</div>
                    </div>
                </div>
            </td>
            <td class="px-6 py-4">
                ${u.is_admin ? 
                    `<span class="bg-tertiary-container text-on-surface px-2.5 py-1 rounded-full text-xs font-medium border border-tertiary/20">Admin</span>` : 
                    `<span class="bg-surface-container border border-outline-variant text-on-surface-variant px-2.5 py-1 rounded-full text-xs">Traveler</span>`
                }
            </td>
            <td class="px-6 py-4 text-center">
                <span class="bg-surface-variant px-2 py-1 rounded text-xs font-medium">${u.trips_count}</span>
            </td>
            <td class="px-6 py-4">
                ${u.is_active ? 
                    `<span class="flex items-center gap-1.5 text-success text-xs font-medium"><span class="w-2 h-2 rounded-full bg-success"></span> Active</span>` : 
                    `<span class="flex items-center gap-1.5 text-error text-xs font-medium"><span class="w-2 h-2 rounded-full bg-error"></span> Inactive</span>`
                }
            </td>
            <td class="px-6 py-4 text-right text-on-surface-variant text-xs">
                ${u.created_at || 'N/A'}
            </td>
            <td class="px-6 py-4 text-center">
                <div class="flex items-center justify-center gap-2">
                    <button onclick="toggleRole(${u.id}, ${!u.is_admin})" class="p-1.5 text-on-surface-variant hover:text-primary hover:bg-primary-container rounded transition-colors" title="${u.is_admin ? 'Demote to Traveler' : 'Promote to Admin'}">
                        <span class="material-symbols-outlined text-[18px]">admin_panel_settings</span>
                    </button>
                    <button onclick="toggleStatus(${u.id}, ${!u.is_active})" class="p-1.5 text-on-surface-variant hover:text-${u.is_active ? 'error' : 'success'} hover:bg-${u.is_active ? 'error' : 'success'}-container rounded transition-colors" title="${u.is_active ? 'Deactivate' : 'Activate'}">
                        <span class="material-symbols-outlined text-[18px]">${u.is_active ? 'block' : 'check_circle'}</span>
                    </button>
                </div>
            </td>
        </tr>
    `).join('');
}

async function toggleRole(id, makeAdmin) {
    if (confirm(`Are you sure you want to ${makeAdmin ? 'promote this user to Admin' : 'demote this Admin to Traveler'}?`)) {
        try {
            const res = await fetch(`/api/admin/users/${id}/role`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(makeAdmin)
            });
            const json = await res.json();
            if (json.success) {
                showAdminToast('Success', json.message, 'success');
                fetchUsers();
            } else {
                showAdminToast('Error', json.detail || 'Failed to update role', 'error');
            }
        } catch (e) {
            showAdminToast('Error', 'Request failed', 'error');
        }
    }
}

async function toggleStatus(id, makeActive) {
    if (confirm(`Are you sure you want to ${makeActive ? 'activate' : 'deactivate'} this user?`)) {
        try {
            const res = await fetch(`/api/admin/users/${id}/status`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(makeActive)
            });
            const json = await res.json();
            if (json.success) {
                showAdminToast('Success', json.message, 'success');
                fetchUsers();
            } else {
                showAdminToast('Error', json.detail || 'Failed to update status', 'error');
            }
        } catch (e) {
            showAdminToast('Error', 'Request failed', 'error');
        }
    }
}

document.getElementById('searchInput').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const filtered = allUsers.filter(u => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q));
    renderUsers(filtered);
});

document.addEventListener('DOMContentLoaded', fetchUsers);
</script>
{% endblock %}
