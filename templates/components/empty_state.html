{% macro empty_state(title, message, button_text=None, button_url=None, icon='explore') %}
<div class="flex flex-col items-center justify-center text-center p-12 bg-surface-container-low rounded-3xl border border-outline-variant/30 border-dashed max-w-2xl mx-auto my-8">
    <div class="w-24 h-24 rounded-full bg-surface-variant/50 flex items-center justify-center mb-6 text-outline">
        <span class="material-symbols-outlined text-[48px]">{{ icon }}</span>
    </div>
    
    <h3 class="font-headline-md text-headline-md text-on-surface mb-3 text-3xl">{{ title }}</h3>
    <p class="font-body-md text-on-surface-variant max-w-md mb-8">{{ message }}</p>
    
    {% if button_text and button_url %}
    <a href="{{ button_url }}" class="inline-flex items-center gap-2 bg-primary hover:bg-primary-container text-on-primary px-6 py-3 rounded-full font-ui-button transition-all shadow-[0_0_20px_rgba(255,180,162,0.2)] hover:shadow-[0_0_25px_rgba(255,180,162,0.4)] hover:-translate-y-0.5">
        <span class="material-symbols-outlined text-[20px]">add</span>
        {{ button_text }}
    </a>
    {% endif %}
</div>
{% endmacro %}
