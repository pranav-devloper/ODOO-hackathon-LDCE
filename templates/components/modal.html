<div id="global-modal" class="fixed inset-0 z-[60] hidden">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-background/80 backdrop-blur-sm transition-opacity" id="modal-backdrop"></div>
    
    <!-- Modal Content -->
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
        <div class="relative bg-surface-container rounded-2xl border border-outline-variant text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:max-w-lg w-full max-h-[90vh] flex flex-col" id="modal-panel">
            <!-- Header -->
            <div class="px-6 py-4 border-b border-outline-variant flex justify-between items-center bg-surface-container-high">
                <h3 class="text-headline-md font-headline-md text-on-surface m-0 text-xl" id="modal-title">Modal Title</h3>
                <button type="button" class="text-on-surface-variant hover:text-on-surface transition-colors rounded-full p-1 hover:bg-surface-variant" onclick="document.getElementById('global-modal').classList.add('hidden')">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            
            <!-- Body -->
            <div class="px-6 py-4 overflow-y-auto font-body-md text-on-surface-variant" id="modal-body">
                <!-- Dynamic Content Goes Here -->
            </div>
            
            <!-- Footer -->
            <div class="px-6 py-4 border-t border-outline-variant bg-surface-container-high flex justify-end gap-3" id="modal-footer">
                <!-- Dynamic Buttons Go Here -->
            </div>
        </div>
    </div>
</div>
