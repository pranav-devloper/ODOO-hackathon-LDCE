<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GlobeTrotter{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#0b0f19",
            "on-background": "#fdfcf8",
            "surface": "#111827",
            "on-surface": "#f3f4f6",
            "surface-variant": "#1e293b",
            "on-surface-variant": "#9ca3af",
            "surface-container-lowest": "#030712",
            "surface-container-low": "#111827",
            "surface-container": "#1f2937",
            "surface-container-high": "#374151",
            "surface-container-highest": "#4b5563",
            "outline": "#6b7280",
            "outline-variant": "#4b5563",
            "primary": "#ea580c",
            "on-primary": "#ffffff",
            "primary-container": "#c2410c",
            "on-primary-container": "#ffedd5",
            "secondary": "#8b5cf6",
            "on-secondary": "#ffffff",
            "secondary-container": "#7c3aed",
            "on-secondary-container": "#f3e8ff",
            "tertiary": "#fbbf24",
            "on-tertiary": "#000000",
            "tertiary-container": "#d97706",
            "on-tertiary-container": "#fef3c7",
            "error": "#ef4444",
            "on-error": "#ffffff",
            "error-container": "#dc2626",
            "on-error-container": "#fee2e2",
            "success": "#10b981",
            "warning": "#f59e0b",
            "info": "#3b82f6",
            /* Legacy Aliases for unmigrated pages */
            "bg": "#0b0f19",
            "surface-light": "#1f2937",
            "primary-light": "#c2410c",
            "text": "#fdfcf8",
            "text-light": "#f3f4f6",
            "text-muted": "#9ca3af"
          },
          fontFamily: {
            "ui-button": ["Plus Jakarta Sans", "sans-serif"],
            "display-xl": ["Libre Caslon Text", "serif"],
            "headline-md": ["Libre Caslon Text", "serif"],
            "headline-lg": ["Libre Caslon Text", "serif"],
            "display-lg": ["Libre Caslon Text", "serif"],
            "display-sm": ["Libre Caslon Text", "serif"],
            "label-caps": ["Plus Jakarta Sans", "sans-serif"],
            "body-md": ["Plus Jakarta Sans", "sans-serif"],
            "body-lg": ["Plus Jakarta Sans", "sans-serif"]
          },
          fontSize: {
            "ui-button": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
            "display-xl": ["100px", {"lineHeight": "100px", "letterSpacing": "-0.02em", "fontWeight": "400"}],
            "headline-md": ["32px", {"lineHeight": "40px", "fontWeight": "400"}],
            "headline-lg": ["48px", {"lineHeight": "56px", "fontWeight": "400"}],
            "display-lg": ["72px", {"lineHeight": "80px", "letterSpacing": "-0.01em", "fontWeight": "400"}],
            "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700"}],
            "body-md": ["16px", {"lineHeight": "28px", "fontWeight": "400"}],
            "body-lg": ["18px", {"lineHeight": "32px", "fontWeight": "400"}]
          },
          spacing: {
            "stack-lg": "48px",
            "gutter": "24px",
            "section-gap": "120px",
            "margin-safe": "5vw",
            "stack-sm": "8px",
            "stack-md": "16px"
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "full": "9999px"
          }
        }
      }
    }
    </script>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-background text-on-background min-h-screen font-body-md text-body-md overflow-x-hidden flex flex-col">
    
    {% include 'components/navbar.html' %}
    
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>
    
    {% include 'components/toast.html' %}
    
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
