{% extends 'base.html' %}

{% block title %}Edit Trip - GlobeTrotter{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="flex items-center justify-between mb-10">
        <h1 class="text-4xl md:text-5xl font-serif text-primary tracking-wide uppercase">Edit Journey</h1>
        <a href="{{ url_for('trip_detail', trip_id=trip.id) }}" class="text-on-surface/60 hover:text-primary transition-colors flex items-center text-sm font-medium uppercase tracking-wider">
            <span class="material-symbols-outlined mr-1">arrow_back</span> Cancel
        </a>
    </div>

    <div class="bg-surface-container rounded-2xl p-8 shadow-xl border border-black/5 mb-8">
        <form id="edit-trip-form" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-on-surface/80 uppercase tracking-wider mb-2">Trip Name *</label>
                <input type="text" id="name" name="name" required value="{{ trip.name }}" 
                       class="w-full bg-background border border-black/10 rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-on-surface/80 uppercase tracking-wider mb-2">Description</label>
                <textarea id="description" name="description" rows="3"
                          class="w-full bg-background border border-black/10 rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">{{ trip.description }}</textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="start_date" class="block text-sm font-medium text-on-surface/80 uppercase tracking-wider mb-2">Start Date *</label>
                    <input type="date" id="start_date" name="start_date" required value="{{ trip.start_date.strftime('%Y-%m-%d') if trip.start_date else '' }}"
                           class="w-full bg-background border border-black/10 rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors [color-scheme:dark]">
                </div>
                <div>
                    <label for="end_date" class="block text-sm font-medium text-on-surface/80 uppercase tracking-wider mb-2">End Date *</label>
                    <input type="date" id="end_date" name="end_date" required value="{{ trip.end_date.strftime('%Y-%m-%d') if trip.end_date else '' }}"
                           class="w-full bg-background border border-black/10 rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors [color-scheme:dark]">
                </div>
            </div>

            <div>
                <label for="budget" class="block text-sm font-medium text-on-surface/80 uppercase tracking-wider mb-2">Estimated Budget (₹)</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <span class="text-on-surface/50">₹</span>
                    </div>
                    <input type="number" id="budget" name="budget" value="{{ trip.budget }}" min="0" step="100"
                           class="w-full bg-background border border-black/10 rounded-xl pl-10 pr-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                </div>
            </div>

            <div>
                <label for="cover_image" class="block text-sm font-medium text-on-surface/80 uppercase tracking-wider mb-2">Cover Image URL</label>
                <input type="url" id="cover_image" name="cover_image" value="{{ trip.cover_image or '' }}"
                       class="w-full bg-background border border-black/10 rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
            </div>

            <div id="error-message" class="hidden text-red-400 text-sm mt-2"></div>

            <div class="pt-4 flex justify-end">
                <button type="submit" id="submit-btn" class="flex justify-center py-3 px-8 border border-transparent rounded-xl shadow-sm text-sm font-medium text-background bg-primary hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors uppercase tracking-widest">
                    Save Changes
                </button>
            </div>
        </form>
    </div>

    <!-- Danger Zone -->
    <div class="bg-red-900/10 border border-red-500/20 rounded-2xl p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h3 class="text-red-400 font-medium uppercase tracking-wider text-sm mb-1">Danger Zone</h3>
            <p class="text-on-surface/60 text-sm">Once you delete a trip, there is no going back. Please be certain.</p>
        </div>
        <button onclick="deleteTrip()" class="py-2 px-6 border border-red-500/50 text-red-400 rounded-xl hover:bg-red-500 hover:text-background transition-colors text-sm font-medium uppercase tracking-wider whitespace-nowrap">
            Delete Trip
        </button>
    </div>
</div>

<script>
document.getElementById('edit-trip-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errorDiv = document.getElementById('error-message');
    
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin mr-2">progress_activity</span> Saving...';
    errorDiv.classList.add('hidden');
    
    const formData = new FormData(this);
    const data = Object.fromEntries(formData.entries());
    
    try {
        const response = await fetch(`/api/trips/{{ trip.id }}`, {
            method: 'PATCH',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (result.success) {
            window.location.href = `/trips/{{ trip.id }}`;
        } else {
            errorDiv.textContent = result.error.message || 'Failed to update trip.';
            errorDiv.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = 'SAVE CHANGES';
        }
    } catch (err) {
        errorDiv.textContent = 'An unexpected error occurred. Please try again.';
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'SAVE CHANGES';
    }
});

async function deleteTrip() {
    if(confirm('Are you absolutely sure you want to delete this trip? All itinerary and budget data will be lost forever.')) {
        try {
            const response = await fetch(`/api/trips/{{ trip.id }}`, {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'}
            });
            if(response.ok) {
                window.location.href = '/trips';
            } else {
                alert('Failed to delete trip.');
            }
        } catch(err) {
            alert('An error occurred.');
        }
    }
}
</script>
{% endblock %}
