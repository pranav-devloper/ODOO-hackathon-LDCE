{% extends 'base.html' %}

{% block title %}Create Trip - GlobeTrotter{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <div class="mb-10 text-center">
        <h1 class="text-4xl md:text-5xl font-serif text-primary tracking-wide uppercase">Plan a New Adventure</h1>
        <p class="mt-4 text-on-surface/70 text-lg">Every great journey begins with a single step. Let's start yours.</p>
    </div>

    <div class="bg-surface-container rounded-2xl p-8 shadow-xl border border-outline-variant/10">
        <form id="create-trip-form" class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-on-surface/80 uppercase tracking-wider mb-2">Trip Name *</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Summer in Europe" 
                       class="w-full bg-background border border-outline-variant/30 rounded-xl px-4 py-3 text-on-surface placeholder-on-surface/30 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-on-surface/80 uppercase tracking-wider mb-2">Description</label>
                <textarea id="description" name="description" rows="3" placeholder="What's the vibe of this trip?"
                          class="w-full bg-background border border-outline-variant/30 rounded-xl px-4 py-3 text-on-surface placeholder-on-surface/30 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="start_date" class="block text-sm font-medium text-on-surface/80 uppercase tracking-wider mb-2">Start Date *</label>
                    <input type="date" id="start_date" name="start_date" required
                           class="w-full bg-background border border-outline-variant/30 rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors [color-scheme:dark]">
                </div>
                <div>
                    <label for="end_date" class="block text-sm font-medium text-on-surface/80 uppercase tracking-wider mb-2">End Date *</label>
                    <input type="date" id="end_date" name="end_date" required
                           class="w-full bg-background border border-outline-variant/30 rounded-xl px-4 py-3 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors [color-scheme:dark]">
                </div>
            </div>

            <div>
                <label for="budget" class="block text-sm font-medium text-on-surface/80 uppercase tracking-wider mb-2">Estimated Budget (₹)</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <span class="text-on-surface/50">₹</span>
                    </div>
                    <input type="number" id="budget" name="budget" placeholder="100000" min="0" step="100"
                           class="w-full bg-background border border-outline-variant/30 rounded-xl pl-10 pr-4 py-3 text-on-surface placeholder-on-surface/30 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
                </div>
            </div>

            <div>
                <label for="cover_image" class="block text-sm font-medium text-on-surface/80 uppercase tracking-wider mb-2">Cover Image URL</label>
                <input type="url" id="cover_image" name="cover_image" placeholder="https://example.com/image.jpg"
                       class="w-full bg-background border border-outline-variant/30 rounded-xl px-4 py-3 text-on-surface placeholder-on-surface/30 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors">
            </div>

            <div id="error-message" class="hidden text-error text-sm mt-2 font-bold bg-error-container text-on-error-container p-3 rounded-xl"></div>

            <div class="pt-4">
                <button type="submit" id="submit-btn" class="w-full flex justify-center py-4 px-4 border border-transparent rounded-full shadow-sm text-sm font-bold text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors uppercase tracking-widest shadow-[0_0_15px_rgba(234,88,12,0.3)]">
                    Create Journey
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('create-trip-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const errorDiv = document.getElementById('error-message');
    
    // Basic validation
    const startDate = new Date(document.getElementById('start_date').value);
    const endDate = new Date(document.getElementById('end_date').value);
    
    if (startDate > endDate) {
        errorDiv.textContent = 'End date cannot be before start date.';
        errorDiv.classList.remove('hidden');
        return;
    }
    
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin mr-2">progress_activity</span> Creating...';
    errorDiv.classList.add('hidden');
    
    const formData = new FormData(this);
    const data = Object.fromEntries(formData.entries());
    
    // No initial destinations - they can be added later in the itinerary builder
    data.destinations = [];
    
    try {
        const response = await fetch('/api/trips', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (result.success) {
            window.location.href = `/trips/${result.data.id}/itinerary`;
        } else {
            errorDiv.textContent = result.error.message || 'Failed to create trip.';
            errorDiv.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = 'CREATE JOURNEY';
        }
    } catch (err) {
        errorDiv.textContent = 'An unexpected error occurred. Please try again.';
        errorDiv.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'CREATE JOURNEY';
    }
});
</script>
{% endblock %}
