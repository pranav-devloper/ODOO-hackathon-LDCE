{% extends 'base.html' %}

{% block head %}
<style>
  .auth-bg {
    background-color: #0b0914;
    background-image: radial-gradient(circle at 50% 50%, rgba(45, 27, 61, 0.4) 0%, transparent 60%),
                      linear-gradient(180deg, #100b16 0%, #1a1721 100%);
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-bg min-h-screen flex items-center justify-center p-6 relative">
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-tertiary/10 blur-[100px] rounded-full pointer-events-none"></div>
  
  <div class="w-full max-w-md bg-surface-container/80 backdrop-blur-xl border border-black/5 rounded-3xl p-8 md:p-10 shadow-2xl relative z-10 text-center">
    <div class="mb-8">
      <div class="w-16 h-16 bg-surface-highest rounded-full flex items-center justify-center mx-auto mb-4 border border-black/10">
        <span class="material-symbols-outlined text-3xl text-primary">lock_reset</span>
      </div>
      <h1 class="font-display text-2xl text-on-surface mb-2">Reset Your Password</h1>
      <p class="text-muted font-ui text-sm">Enter the email address associated with your account, and we'll send you a link to reset your password.</p>
    </div>

    <form class="space-y-6" onsubmit="event.preventDefault(); alert('Reset link sent! (Simulation)');">
      <div class="text-left">
        <label for="email" class="block text-sm font-medium text-text mb-2">Email Address</label>
        <input type="email" id="email" name="email" required
               class="w-full bg-surface-lowest border border-black/10 rounded-xl px-4 py-3 text-text placeholder:text-muted/50 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-transparent transition-all"
               placeholder="traveler@example.com">
      </div>

      <button type="submit" class="w-full bg-primary text-on-primary hover:bg-[#e6a292] font-bold rounded-xl px-4 py-4 transition-all flex items-center justify-center gap-2">
        <span>SEND RESET LINK</span>
        <span class="material-symbols-outlined text-sm">mail</span>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-black/10">
      <a href="{{ url_for('login_page') }}" class="text-sm text-muted hover:text-primary transition-colors flex items-center justify-center gap-2">
        <span class="material-symbols-outlined text-sm">arrow_back</span>
        Back to Sign In
      </a>
    </div>
  </div>
</div>
{% endblock %}
