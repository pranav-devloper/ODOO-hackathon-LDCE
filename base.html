<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GlobeTrotter{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-tint": "#ffb4a2",
            "tertiary-fixed-dim": "#ecc15a",
            "surface-container-high": "#2b2a26",
            "outline-variant": "#56423e",
            "on-background": "#e6e2db",
            "on-primary-container": "#5d1302",
            "tertiary-container": "#b7912f",
            "on-primary": "#601503",
            "error-container": "#93000a",
            "primary-fixed": "#ffdad2",
            "outline": "#a48b85",
            "tertiary-fixed": "#ffdf99",
            "on-error": "#690005",
            "secondary-fixed": "#e4dfff",
            "error": "#ffb4ab",
            "surface-dim": "#141310",
            "background": "#141310",
            "surface-variant": "#363530",
            "on-surface-variant": "#dcc0ba",
            "on-surface": "#e6e2db",
            "surface-container-lowest": "#0f0e0b",
            "primary": "#ffb4a2",
            "surface": "#141310",
            "tertiary": "#ecc15a",
            "secondary": "#c7c2ea",
            "on-secondary": "#2f2d4c",
            "on-secondary-container": "#b6b1d7",
            "surface-container-low": "#1c1c18",
            "surface-container": "#20201c",
            "inverse-surface": "#e6e2db",
            "secondary-container": "#464364",
            "surface-bright": "#3a3935",
            "primary-container": "#e4775c",
            "surface-container-highest": "#363530",
            "success": "#4ade80",
            "warning": "#fbbf24",
            "info": "#60a5fa"
          },
          fontFamily: {
            "ui-button": ["Plus Jakarta Sans"],
            "display-xl": ["Libre Caslon Text"],
            "headline-md": ["Libre Caslon Text"],
            "headline-lg": ["Libre Caslon Text"],
            "display-lg": ["Libre Caslon Text"],
            "label-caps": ["Plus Jakarta Sans"],
            "body-md": ["Plus Jakarta Sans"],
            "body-lg": ["Plus Jakarta Sans"]
          },
          fontSize: {
            "ui-button": ["14px", {"lineHeight": "20px", "fontWeight": "600"}],
            "display-xl": ["120px", {"lineHeight": "110px", "letterSpacing": "-0.02em", "fontWeight": "400"}],
            "headline-md": ["32px", {"lineHeight": "40px", "fontWeight": "400"}],
            "headline-lg": ["48px", {"lineHeight": "56px", "fontWeight": "400"}],
            "display-lg": ["80px", {"lineHeight": "88px", "letterSpacing": "-0.01em", "fontWeight": "400"}],
            "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700"}],
            "body-md": ["16px", {"lineHeight": "28px", "fontWeight": "400"}],
            "body-lg": ["18px", {"lineHeight": "32px", "fontWeight": "400"}]
          },
          spacing: {
            "stack-lg": "48px",
            "gutter": "24px",
            "section-gap": "120px",
            "margin-safe": "5vw",
            "stack-sm": "8px",
            "stack-md": "16px"
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "2xl": "0.75rem",
            "full": "9999px"
          }
        }
      }
    }
    </script>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md text-body-md overflow-x-hidden flex flex-col">
    
    {% include 'components/navbar.html' %}
    
    <main class="flex-grow pt-[80px]">
        {% block content %}{% endblock %}
    </main>
    
    {% include 'components/toast.html' %}
    
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
